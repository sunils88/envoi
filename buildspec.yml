version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 18   # or 20, depending on your project
    commands:
      - npm install
  build:
    commands:
      - npm run build   # this creates your dist/build folder
artifacts:
  files:
    - '**/*'
  base-directory: dist   # or 'build' for Create React App, 'out' for Next.js, etc.
  discard-paths: yes
